name: IDA Docker 9.x

on:
  push:
    #tags:
    #  - "*"
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with shell debugging enabled'
        required: false
        default: true

jobs:

  build:
    strategy:
      matrix:
        include:
          #- target: win_x86_32
          #  os: windows-latest
          - name: "IDA 9.0 SP1"
            installer: ida-pro_90sp1_x64linux.run
            tool_package: ida-pro_90sp1_tools.tar
            build-args: |
              PYTHON_VERSION=3.12.10
              QT=5
            tag_name: "9.0sp1"

          - name: "IDA 9.1"
            installer: ida-pro_91_x64linux.run
            build-args: |
              PYTHON_VERSION=3.12.10
              QT=5
            tag_name: "9.1"

          - name: "IDA 9.2"
            installer: ida-pro_92_x64linux.run
            build-args: |
              PYTHON_VERSION=3.12.10
              QT=6
            tag_name: "9.2"

          - name: "IDA 9.3"
            installer: ida-pro_93_x64linux.run
            build-args: |
              PYTHON_VERSION=3.12.10
            tag_name: "9.3"
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      -
        name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Check ida-linux-9.x revision
        id: ida9_revision
        env:
          GHCR_IMAGE: ghcr.io/nyamisty/docker-ida:${{ matrix.tag_name }}
        run: |
          set -euo pipefail

          revision="$(git log -1 --format=%H -- ida-linux-9.x)"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

          builder_args_json="$(jq -nc \
            --arg installer "installers/${{ matrix.installer }}" \
            --arg tool_package "installers/${{ matrix.tool_package || '' }}" \
            --arg extra "${{ matrix.build-args }}" \
            '{INSTALLER: $installer, TOOL_PACKAGE: $tool_package} + (($extra | split("\n") | map(select(length > 0)) | map(capture("^(?<key>[^=]+)=(?<value>.*)$")) | map({(.key): .value}) | add) // {})')"
          builder_args="$(jq -nr --arg value "$builder_args_json" '$value | @uri')"
          echo "builder_args=${builder_args}" >> "$GITHUB_OUTPUT"

          if ! docker pull "$GHCR_IMAGE"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No existing ${GHCR_IMAGE}; building ida-linux-9.x revision ${revision}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          image_revision="$(docker image inspect "$GHCR_IMAGE" | jq -r '.[0].Config.Labels["builder.file.revision"] // ""')"
          image_builder_args="$(docker image inspect "$GHCR_IMAGE" | jq -r '.[0].Config.Labels["builder.args"] // ""')"

          if [ "$image_revision" = "$revision" ] && [ "$image_builder_args" = "$builder_args" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Existing ${GHCR_IMAGE} already contains builder.file.revision ${revision} and matching builder.args; skipping build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Existing ${GHCR_IMAGE} contains builder.file.revision ${image_revision:-<none>} and builder.args ${image_builder_args:-<none>}; building ${revision}." >> "$GITHUB_STEP_SUMMARY"
          fi

      -
        name: Set up Docker Buildx
        if: steps.ida9_revision.outputs.should_build == 'true'
        id: buildx
        uses: docker/setup-buildx-action@v1
      #-     
      #  name: Cache Docker layers
      #  uses: actions/cache@v2
      #  with:
      #    path: /tmp/.buildx-cache
      #    key: ${{ runner.os }}-buildx-${{ github.sha }}
      #    restore-keys: |
      #      ${{ runner.os }}-buildx-
      -
        if: steps.ida9_revision.outputs.should_build == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Install Rclone
        if: steps.ida9_revision.outputs.should_build == 'true'
        env:
          RCLONE_SERVACCOUNT: ${{ secrets.RCLONE_SERVACCOUNT }}
        run: |
            curl https://rclone.org/install.sh | sudo bash
            mkdir -p ~/.config/rclone
            cat << CONF > ~/.config/rclone/rclone.conf
            [gd-priv]
            type = drive
            scope = drive
            service_account_file = /tmp/rclone-servaccount.json
            team_drive = 0AF9_qbIBRhtrUk9PVA
            root_folder_id = 
            CONF
            echo $RCLONE_SERVACCOUNT | base64 -d > /tmp/rclone-servaccount.json
            rclone about -vv gd-priv:
      
      #- name: Setup tmate session
      #  uses: mxschmitt/action-tmate@v3
      
      -
        name: Download IDA
        if: steps.ida9_revision.outputs.should_build == 'true'
        run: |
            cd ./ida-linux-9.x
            mkdir -p installers
            rclone copy -vP gd-priv:ida-leak/${{ matrix.installer }} installers
            if [[ "${{ matrix.tool_package || '' }}" != "" ]]; then
              rclone copy -vP gd-priv:ida-leak/${{ matrix.tool_package }} installers
            fi
            ls -alh installers

      -
        name: Build & Push ${{ matrix.name }}
        if: steps.ida9_revision.outputs.should_build == 'true'
        id: docker_build_ida
        uses: docker/build-push-action@v2
        with:
          allow: security.insecure
          builder: ${{ steps.buildx.outputs.name }}
          #push: true
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          context: ./ida-linux-9.x
          file: ./ida-linux-9.x/Dockerfile
          build-args: |
            INSTALLER=installers/${{ matrix.installer }}
            TOOL_PACKAGE=installers/${{ matrix.tool_package || '' }}
            ${{ matrix.build-args }}
          labels: |
            builder.file.revision=${{ steps.ida9_revision.outputs.revision }}
            builder.args=${{ steps.ida9_revision.outputs.builder_args }}
            org.opencontainers.image.revision=${{ steps.ida9_revision.outputs.revision }}
          tags: ida:${{ matrix.tag_name }}
      -
        name: Image digest
        if: steps.ida9_revision.outputs.should_build == 'true'
        run: |
          set -x
          echo "Image built for ${{ matrix.name }}: ${{ steps.docker_build_ida.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

      - name: Enable Shell Access
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
        run: |
          set -x
          RELAY=relay.tunshell.com
          SECRET=0000000000000000000000
          KEYS=$(curl -sSf -X POST https://relay.tunshell.com/api/sessions); echo $KEYS | jq -r '.peer1_key' > peer1; echo $KEYS | jq -r '.peer2_key' > peer2;
          (while true; do
            echo "Connect to github actions node using: sh <(curl -sSf https://lets.tunshell.com/init.sh) L $(cat peer2) 0000000000000000000000 $RELAY"
            echo "Or: https://tunshell.com/term#$(cat peer2),$SECRET,$RELAY"
            sleep 1
          done) &
          curl -sSf https://lets.tunshell.com/init.sh | sh -s -- T $(cat peer1) $SECRET $RELAY

      -
        name: Docker Push
        if: steps.ida9_revision.outputs.should_build == 'true'
        run: |
          DIGEST=${{ steps.docker_build_ida.outputs.digest }}
          docker tag ida:${{ matrix.tag_name }} nyamisty/docker-ida:${{ matrix.tag_name }}
          docker push nyamisty/docker-ida:${{ matrix.tag_name }} || true
          docker tag ida:${{ matrix.tag_name }} ghcr.io/nyamisty/docker-ida:${{ matrix.tag_name }}
          docker push ghcr.io/nyamisty/docker-ida:${{ matrix.tag_name }} || true